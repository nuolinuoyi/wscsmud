<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GM管理后台</title>
    <link rel="stylesheet" href="./styles/admin.css" />
</head>
<body>
    <div id="app">
        <div class="admin-layout">
            <div class="sidebar">
                <div class="logo">GM管理后台</div>
                <nav class="menu">
                    <a href="#" class="menu-item active" data-page="dashboard">赛季总览</a>
                    <a href="#" class="menu-item" data-page="player-search">玩家搜索</a>
                    <a href="#" class="menu-item" data-page="season-manager">赛季管理</a>
                </nav>
            </div>
            <div class="main-content">
                <div class="header">
                    <span id="admin-name">管理员</span>
                    <button id="btn-logout" class="btn btn-sm">退出</button>
                </div>
                <div id="page-content" class="page-content">
                    <!-- 页面内容动态加载 -->
                </div>
            </div>
        </div>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display:none">
        <div id="modal-content" class="modal-content"></div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
